version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: hospital_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: J1w2a3l4i5t6@
      POSTGRES_DB: hospital_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: hospital_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: hospital_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=J1w2a3l4i5t6%40
      - POSTGRES_DB=hospital_db
      - REDIS_URL=redis://redis:6379/0
      # Can also load directly from env file if preferred:
      # env_file:
      #   - ./Backend/.env
    depends_on:
      - db
      - redis
    volumes:
      - ./Backend:/app
    # Remove the command below if you want to use CMD from Dockerfile
    # command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
  redis_data:
